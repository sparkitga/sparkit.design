name: SparkIt brand cleanup

on:
  push:
    paths:
      - '.github/workflows/sparkit-brand-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update slogan and remove breadcrumb markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          new_slogan = "Content Families Can Count On"
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              replacements = {
                  'Sales Made Simple With Video and Social Media': f'{new_slogan} | Video and Social Media',
                  'Sales Made Simple.': f'{new_slogan}.',
                  'Sales Made Simple': new_slogan,
                  'Think with your hands.': f'{new_slogan}.',
                  'Think with your hands': new_slogan,
                  'Content Families Count On.': f'{new_slogan}.',
                  'Content Families Count On': new_slogan,
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Remove breadcrumb navigation blocks if they exist now or are added later.
              patterns = [
                  r'<nav\b[^>]*(?:class=["\'][^"\']*breadcrumb[^"\']*["\']|aria-label=["\'][^"\']*breadcrumb[^"\']*["\'])[^>]*>.*?</nav>',
                  r'<ol\b[^>]*class=["\'][^"\']*breadcrumb[^"\']*["\'][^>]*>.*?</ol>',
                  r'<ul\b[^>]*class=["\'][^"\']*breadcrumb[^"\']*["\'][^>]*>.*?</ul>',
                  r'<div\b[^>]*class=["\'][^"\']*breadcrumb[^"\']*["\'][^>]*>.*?</div>',
              ]
              for pattern in patterns:
                  text = re.sub(pattern, '', text, flags=re.I | re.S)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          css_path = Path('styles.css')
          if css_path.exists():
              css = css_path.read_text(encoding='utf-8')
              guard = '''\n\n/* Breadcrumbs intentionally disabled site-wide */\n.breadcrumb,\n.breadcrumbs,\n[class*="breadcrumb"],\nnav[aria-label="Breadcrumb"],\nnav[aria-label="breadcrumbs"] {\n  display: none !important;\n}\n'''
              if 'Breadcrumbs intentionally disabled site-wide' not in css:
                  css_path.write_text(css.rstrip() + guard, encoding='utf-8')
                  changed.append(str(css_path))

          print('Changed files:')
          for item in changed:
              print('-', item)
          PY

      - name: Commit site cleanup
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply SparkIt slogan and breadcrumb cleanup"
          git push
