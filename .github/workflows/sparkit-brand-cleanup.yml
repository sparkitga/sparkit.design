name: SparkIt brand cleanup

on:
  push:
    paths:
      - '.github/workflows/sparkit-brand-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update SparkIt sitewide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          nav_lines = [
              '<nav class="main-nav" aria-label="Primary navigation">',
              '  <a href="/video/">Video</a>',
              '  <a href="/social-media/">Social Media</a>',
              '  <a href="/georgia-highlights/">Georgia Highlights</a>',
              '  <a href="/realtor-resources/">Realtor Resources</a>',
              '  <a href="/parent-support/">Parent Support</a>',
              '  <a href="/about/">About</a>',
              '  <a href="#contact">Contact</a>',
              '</nav>',
          ]
          new_nav = '\n'.join(nav_lines)
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace('sparkitga@gmail.com', 'welcome@sparkitdesign.com')
              text = text.replace('Content Families Count On', 'Content Families Can Count On')

              text = re.sub(
                  r'<nav\b[^>]*class=["\'][^"\']*main-nav[^"\']*["\'][^>]*>.*?</nav>',
                  new_nav,
                  text,
                  flags=re.I | re.S,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print('-', item)
          PY

      - name: Commit sitewide updates
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply SparkIt navbar sitewide"
          git push
